<div class="container my-5">
    <div class="card shadow-lg border-0">
        <!-- Encabezado -->
        <div class="card-header bg-primary text-white text-center py-4">
            <h3 class="mb-0">Mi Perfil</h3>
        </div>

        <!-- Cuerpo de la tarjeta -->
        <div class="card-body p-4">
            <!-- Información básica -->
            <div class="row">
                <div class="col-md-4 text-center">
                    <img src="https://via.placeholder.com/150" alt="Foto de perfil"
                        class="rounded-circle img-thumbnail mb-3" />
                    <br>
                    <button class="btn btn-outline-primary btn-sm mt-2">Cambiar Foto</button>
                </div>

                <div class="col-md-8">
                    <h5 class="text-muted">Información Personal</h5>
                    <form (submit)="guardarCambios()">
                        <div class="mb-3">
                            <label for="name" class="form-label">Nombre</label>
                            <input type="text" id="name" class="form-control" [(ngModel)]="nombre" name="nombre" placeholder="Tu nombre completo" required />
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" id="email" class="form-control" [(ngModel)]="email" name="email" placeholder="Tu correo electrónico" required />
                        </div>
                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="text" id="telefono" class="form-control" [(ngModel)]="telefono" name="telefono" placeholder="Tu número de teléfono" required />
                        </div>
                        <button type="submit" class="btn btn-outline-primary btn-sm mt-2">Guardar Cambios</button>
                    </form>

                    <!-- Botón de Eliminar Cuenta -->
                    <div class="mt-4">
                        <button class="btn btn-outline-danger btn-sm" (click)="confirmarEliminarCuenta()">Eliminar Cuenta</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

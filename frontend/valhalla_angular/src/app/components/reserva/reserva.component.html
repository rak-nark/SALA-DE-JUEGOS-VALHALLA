<div class="container mt-5">
    <div class="container-xxl formContainer animated-border">
        <!-- Título principal -->
        <h2 class="text-center mb-4">Gestión de Préstamos de Consolas</h2>
        <!-- Formulario de Agregar Préstamo -->
        <div class="add-loan">
            <h3 class="text-center mb-4">Agregar Préstamo</h3>
            <form [formGroup]="form" (ngSubmit)="guardar()">
                <!-- Fecha del préstamo -->
                <div class="mb-3">
                    <label for="fecha" class="form-label">Fecha del préstamo</label>
                    <input type="date" class="form-control custom-input animated-border" formControlName="fecha"
                        id="fecha" [min]="hoy" [max]="dosDiasDespues">
                    <div *ngIf="form.get('fecha')?.hasError('fechaInvalida')" class="text-danger">
                        Las reservas solo pueden realizarse desde hoy hasta un máximo de dos días después.
                    </div>
                </div>
                <!-- Hora del préstamo -->
                <div class="mb-3">
                    <label for="hora" class="form-label">Hora del préstamo</label>
                    <input type="time" class="form-control custom-input animated-border" formControlName="hora"
                        id="hora" step="1800">
                </div>
                <!-- Tiempo de uso -->
                <div class="mb-3">
                    <label for="tiempodeuso" class="form-label">Tiempo de uso:</label>
                    <select id="tiempodeuso" formControlName="tiempodeuso"
                        class="form-select custom-input animated-border">
                        <option *ngFor="let tiempo of tiemposDisponibles" [value]="tiempo.value">
                            {{ tiempo.label }}
                        </option>
                    </select>
                </div>
                <!-- Checkbox de reserva -->
                <div class="mb-3 form-check" [hidden]="true">
                    <input type="checkbox" class="form-check-input custom-checkbox animated-border"
                        formControlName="reserva" id="reserva">
                    <label class="form-check-label " for="reserva">¿Es reserva?</label>
                </div>
                <!-- ID Cliente (oculto) -->
                <div class="mb-3" [hidden]="true">
                    <label for="id_cliente" class="form-label">ID Cliente</label>
                    <input type="text" class="form-control custom-input" formControlName="id_cliente" id="id_cliente"
                        readonly>
                </div>
                <!-- Selección de consola -->
                <div class="form-group mb-3">
                    <label for="id_consola" class="form-label">Selecciona Consola</label>
                    <select formControlName="id_consola" class="form-select custom-input animated-border" required>
                        <option *ngFor="let consola of consolas" [value]="consola.id">{{ consola.nombre }}</option>
                    </select>
                </div>
                <!-- Botón de guardar -->
                <div class="form-actions text-center">
                    <button type="submit" class="btn btn-primary custom-btn">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

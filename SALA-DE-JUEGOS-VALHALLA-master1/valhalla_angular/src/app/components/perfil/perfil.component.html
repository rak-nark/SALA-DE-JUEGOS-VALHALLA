<div class="container my-5">
    <div class="card shadow-lg border-0">
        <!-- Encabezado -->
        <div class="card-header bg-primary text-white text-center py-4">
            <h3 class="mb-0">Mi Perfil</h3>
        </div>
        <!-- Cuerpo de la tarjeta -->
        <div class="card-body p-4">
            <!-- Información básica -->
            <div class="row">
                <div class="col-md-12">
                    <h5 class="text-muted">Información Personal</h5>
                    <form (ngSubmit)="guardarCambios()">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input
                              type="text"
                              id="nombre"
                              name="nombre"
                              class="form-control"
                              [(ngModel)]="cliente.nombreCliente"
                              placeholder="Tu nombre completo"
                              required
                              pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$"
                              #nombre="ngModel"
                            />
                            <div *ngIf="nombre.invalid && nombre.touched" class="text-danger small">
                              <div *ngIf="nombre.errors?.['required']">El nombre es obligatorio.</div>
                              <div *ngIf="nombre.errors?.['pattern']">Solo se permiten letras.</div>
                            </div>
                          </div>
                          
                          <div class="mb-3">
                            <label for="apellido" class="form-label">Apellido</label>
                            <input
                              type="text"
                              id="apellido"
                              name="apellido"
                              class="form-control"
                              [(ngModel)]="cliente.apellidoCliente"
                              placeholder="Tu apellido"
                              required
                              pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$"
                              #apellido="ngModel"
                            />
                            <div *ngIf="apellido.invalid && apellido.touched" class="text-danger small">
                              <div *ngIf="apellido.errors?.['required']">El apellido es obligatorio.</div>
                              <div *ngIf="apellido.errors?.['pattern']">Solo se permiten letras.</div>
                            </div>
                          </div>
                          
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" id="email" class="form-control" [(ngModel)]="cliente.correoCliente" name="email" placeholder="Tu correo electrónico" />
                        </div>
                        <div class="mb-3">
                            <label for="contrasena" class="form-label">Contraseña</label>
                            <input type="password" id="contrasena" class="form-control" [(ngModel)]="cliente.contrasenaCliente" name="contrasena" placeholder="Tu contraseña" />
                        </div>
                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    </form>
                    <!-- Botón de Eliminar Cuenta -->
                    <div class="mt-4">
                        <button class="btn btn-outline-danger btn-sm" (click)="confirmarEliminarCuenta()">Eliminar Cuenta</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

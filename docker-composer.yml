version: '3.8'

services:
  frontend:
    build:
      context: ./frontend/valhalla_angular
      dockerfile: Dockerfile
    container_name: frontend-angular
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/valhalla_angular:/app
    depends_on:
      - backend
    networks:
      - valhalla_net

  backend:
    build:
      context: ./backend/valhalla_laravel
      dockerfile: Dockerfile
    container_name: backend-laravel
    ports:
      - "8000:8000"
    volumes:
      - ./backend/valhalla_laravel:/var/www
    depends_on:
      - db
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=valhalla
      - DB_USERNAME=root
      - DB_PASSWORD=
    networks:
      - valhalla_net

  crud:
    build:
      context: ./CRUD
      dockerfile: Dockerfile
    container_name: crud-php
    ports:
      - "8080:80"
    volumes:
      - ./CRUD:/var/www/html
    depends_on:
      - db
    networks:
      - valhalla_net

  db:
    image: mysql:8.3
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: valhalla
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./DB:/docker-entrypoint-initdb.d 
    networks:
      - valhalla_net

volumes:
  db_data:

networks:
  valhalla_net:
